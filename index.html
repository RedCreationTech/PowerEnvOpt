<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>红创科技 · 电源动环 AI 智慧运维</title>
    <link rel="icon" type="image/svg+xml" href="assets/hongchuang-mark.svg" />
    <link rel="stylesheet" href="styles.css" />

  </head>
  <body>
    <aside id="sidebar">
      <div class="brand">
        <img
          class="brand-logo"
          src="assets/hongchuang-logo.svg"
          alt="红创科技 HCTECH"
        /><img
          class="brand-mark"

          alt="红创科技"
        />

      <div class="workspace">POWER INTELLIGENCE <span>DEMO</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom">
        <span class="dot"></span> 本地演示工作空间<small
          >本机服务 + 合成工单 · v5.0</small
        >
      </div>
    </aside>
    <div class="shell">
      <header>
        <div class="breadcrumbs">
          智慧运维平台 <span>/</span> <b id="crumb">运营总览</b>

          <span class="demo-tag">沙盒演示</span><span class="avatar">林</span
          ><span>林工 · 演示管理员</span>
        </div>
      </header>
      <main>
        <div class="page-heading">
          <div>
            <div class="eyebrow">POWER & ENVIRONMENT OPERATIONS</div>
            <h1 id="title" tabindex="-1">运营总览</h1>
            <p id="subtitle"></p>
          </div>
          <div class="page-actions">
            <select id="site" aria-label="站点筛选">
              <option value="all">全部站点</option>
              <option>北京 · 亦庄数据中心</option>
              <option>上海 · 张江数据中心</option>
              <option>深圳 · 南山数据中心</option></select

          </div>
        </div>
        <div class="notice">
          <span>◉</span> 合成数据 · 无设备连接 · 可选真实 AI
          辅助（须配置并主动调用） <span class="notice-time" id="clock"></span>
        </div>
        <div id="content"></div>
        <footer>
          红创科技 · 电源动环 AI 智慧运维
          <span>需求 7011031111 · 本地交互原型，不代表指标验收结果</span>
        </footer>
      </main>
    </div>
    <div id="toast" role="status"></div>
    <dialog id="dialog">
      <div id="dialog-body"></div>
      <div class="dialog-footer">
        <button onclick="document.getElementById('dialog').close()">
          关闭
        </button>
      </div>
    </dialog>
    <script src="vendor/three.min.js"></script>
    <script src="twin3d.js"></script>
    <script src="iso-kit.js"></script>
    <script src="iso-ac.js"></script>
    <script src="iso-batt.js"></script>
    <script src="iso-pdu.js"></script>
    <script src="iso-energy.js"></script>
    <script src="iso-ups.js"></script>

    <script src="app.js"></script>
    <script src="workflows.js"></script>
    <script src="ai-ui.js"></script>
